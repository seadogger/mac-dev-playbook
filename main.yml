---
- name: Configure host.
  hosts: all

  vars:
    # Sudo is only genuinely required on a bare Mac (creating /opt/homebrew and
    # installing the Command Line Tools). On an already-provisioned machine every
    # become task is a no-op that verifies state without root, so default become
    # OFF — `ansible_become` (a connection variable) overrides the roles' task-level
    # `become: true` keywords. For first-time bootstrap run:
    #   ansible-playbook main.yml -e bootstrap=true --ask-become-pass
    ansible_become: "{{ bootstrap | default(false) | bool }}"

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

    - name: Locate the active developer directory.
      command: xcode-select -p
      register: xcode_select_result
      changed_when: false
      failed_when: false
      check_mode: false
      tags: ['always']

  roles:
    # The command-line-tools role stats /Library/Developer/CommandLineTools,
    # which does not exist when the toolchain comes from full Xcode. It then
    # searches `softwareupdate -l` for a Command Line Tools package, finds none
    # (Xcode already provides it), and fails its own `failed_when`. Skip the
    # role entirely when a developer directory is already active; on a bare Mac
    # `xcode-select -p` exits non-zero and the role runs as intended.
    - role: elliotweiser.osx-command-line-tools
      when: xcode_select_result.rc != 0
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.dotfiles
      when: configure_dotfiles
      tags: ['dotfiles']
    - role: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']

  tasks:
    # Replaces the geerlingguy.mac.mas role; see tasks/mas.yml. Runs here rather
    # than in the roles' slot, so it now comes after the dock role.
    - import_tasks: tasks/mas.yml
      # ansible-core 2.21+ requires conditionals to resolve to a boolean, so
      # the list has to be length-checked rather than used for truthiness.
      when: mas_installed_apps | length > 0
      tags: ['mas']

    - import_tasks: tasks/sudoers.yml
      when: configure_sudoers
      tags: ['sudoers']

    # Must run after the dotfiles role, which symlinks the upstream .zshrc that
    # sources ~/.aliases.
    - import_tasks: tasks/shell-local.yml
      when: configure_shell_local
      tags: ['dotfiles', 'shell-local']

    - import_tasks: tasks/terminal.yml
      when: configure_terminal
      tags: ['terminal']

    - import_tasks: tasks/osx.yml
      when: configure_osx
      tags: ['osx']

    - import_tasks: tasks/extra-packages.yml
      tags: ['extra-packages']

    - import_tasks: tasks/vscode.yml
      when: configure_vscode
      tags: ['vscode']

    - name: Run post-provision task files in a block.
      tags: ['post']
      block:
        - name: Run configured post-provision ansible task files.
          include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"
